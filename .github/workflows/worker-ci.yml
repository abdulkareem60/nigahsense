name: Worker CI

on:
  pull_request:
    paths:
      - "worker/**"
      - "contracts/**"
      - "backend/app/schemas/**"
      - ".github/workflows/worker-ci.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Worker tests (no model)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: worker/requirements-test.txt
      # Tests use a scripted tracker, so PyTorch/Ultralytics are not installed here.
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pip check
      - run: python -m pytest -ra

  tracking:
    name: Tracking regression (Ultralytics, CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      # Replays recorded detector output through the real trackers; no model weights or video are downloaded.
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -ra tests/test_tracking_regression.py tests/test_evaluation_scoring.py
