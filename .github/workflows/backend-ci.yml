name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "contracts/**"
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -ra

  emulator:
    name: Firestore emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Cache Firebase emulator downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-15.35.0
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Run emulator tests
        run: npx --yes firebase-tools@15.35.0 emulators:exec --only firestore --project demo-nigahsense "cd backend && python -m pytest -m emulator -ra"
