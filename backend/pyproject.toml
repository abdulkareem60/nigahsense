[project]
name = "nigahsense-backend"
version = "0.1.0"
description = "NigahSense incident API (FastAPI)"
requires-python = ">=3.14,<3.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["emulator: needs the Firebase Emulator Suite running (FIRESTORE_EMULATOR_HOST set)"]
